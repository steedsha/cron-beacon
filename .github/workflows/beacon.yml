name: beacon

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo "event=${{ github.event_name }}"
          echo "cron=${{ github.event.schedule }}"
          TZ=Asia/Shanghai date '+BJT %F %T'